name: Build iOS 16 IPA

# Builds Yingxia (tvbox-silicon) for iOS 16 and packages an unsigned IPA for
# sideloading with AltStore / SideStore. Run it on a fork: Actions → "Build iOS 16
# IPA" → Run workflow, then download the artifact.

on:
  workflow_dispatch:
  push:
    branches: [main, compat/ios16]

concurrency:
  group: ios16-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select current Xcode SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # build-java-host.sh (the Mac plugin JVM runtime) compiles with JDK 19 + Maven.
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      - name: Install XcodeGen and uv
        run: brew install xcodegen uv autoconf automake libtool cmake ninja pkg-config

      # Build every host and cross-compiled Apple runtime the iOS target embeds.
      # The JVM/FFmpeg/libass/Python/Node pieces download and compile a lot on the
      # first run; this is the long step (can exceed an hour on a busy runner).
      - name: Build plugin hosts and iOS runtimes
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 19 2>/dev/null || true)}"
          Scripts/build-java-host.sh
          Scripts/build-script-host.sh
          Scripts/build-python-host.sh
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh
          Scripts/package-apple-runtime.sh ios
          Scripts/build-apple-python.sh ios
          Scripts/fetch-node-mobile.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned device build. ARCHS is already arm64 in project.yml. Debug keeps
      # the build tolerant of any optional runtime that could not be fetched.
      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-ios \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/DerivedData-ios/Build/Products/Release-iphoneos/TVBox-iOS.app"
          test -d "$APP" || APP="build/DerivedData-ios/Build/Products/Debug-iphoneos/TVBox-iOS.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -ry Yingxia-iOS16.ipa Payload)
          ls -lh build/Yingxia-iOS16.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yingxia-iOS16
          path: build/Yingxia-iOS16.ipa
          if-no-files-found: error
